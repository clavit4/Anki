<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b0e0d'/%3E%3Crect x='24' y='18' width='52' height='64' rx='8' fill='none' stroke='%234fd1a5' stroke-width='5'/%3E%3Cline x1='34' y1='38' x2='66' y2='38' stroke='%234fd1a5' stroke-width='5' stroke-linecap='round'/%3E%3Cline x1='34' y1='52' x2='58' y2='52' stroke='%234fd1a5' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b0e0d'/%3E%3Crect x='24' y='18' width='52' height='64' rx='8' fill='none' stroke='%234fd1a5' stroke-width='5'/%3E%3Cline x1='34' y1='38' x2='66' y2='38' stroke='%234fd1a5' stroke-width='5' stroke-linecap='round'/%3E%3Cline x1='34' y1='52' x2='58' y2='52' stroke='%234fd1a5' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<title>A N K I</title>
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>

<div class="app">

  <!-- ================= DECK SELECT ================= -->
  <section class="screen active" id="screen-deck" aria-labelledby="deck-heading">
    <header class="app-header">
      <h1 class="wordmark">Anki</h1>
      <p class="tagline">Deck list.</p>
    </header>

    <div class="deck-list" id="deckList">
      <!-- deck buttons injected by app.js -->
    </div>
  </section>

  <!-- ================= COUNT SELECT ================= -->
  <section class="screen" id="screen-count" aria-labelledby="count-heading">
    <button class="back-link" id="backToDeck" type="button">&larr; Decks</button>
    <header class="app-header">
      <h1 class="deck-name" id="countDeckName">Deck</h1>
      <p class="tagline">How many?</p>
    </header>

    <div class="count-grid" id="countGrid">
      <!-- count buttons injected by app.js -->
    </div>

    <div class="deck-preview" id="deckPreview">
      <div class="preview-head">
        <p class="preview-heading">Deck entries</p>
        <div class="preview-head-actions">
          <button class="unselect-btn" id="unselectAllBtn" type="button" disabled title="Turn every card back on">Unselect all</button>
          <button class="sort-toggle" id="sortToggle" type="button">Original</button>
        </div>
      </div>
      <ul class="preview-list" id="previewList"></ul>
      <button class="scroll-top-btn" id="scrollTopBtn" type="button" aria-label="Back to top">&uarr;</button>
    </div>
  </section>

  <!-- ================= QUIZ ================= -->
  <section class="screen" id="screen-quiz" aria-labelledby="quiz-heading">
    <div class="quiz-top">
      <button class="back-link" id="quitQuiz" type="button">&larr; End session</button>
      <div class="quiz-top-right">
        <button class="undo-btn" id="undoBtn" type="button" disabled title="Go back to the last card and change its grade">
          <span aria-hidden="true">&#8630;</span> Undo
        </button>
        <span class="progress-count" id="progressCount">1 / 10</span>
      </div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <p class="score-live" id="scoreLive">
      <span class="score-hit" id="scoreHitCount">0</span> got it<span class="score-sep">&middot;</span><span class="score-miss" id="scoreMissCount">0</span> missed
    </p>

    <div class="card-stage">
      <div class="card" id="card" tabindex="0" role="button" aria-pressed="false" aria-label="Flashcard, tap to reveal the answer">
        <div class="card-inner" id="cardInner">
          <div class="card-face card-front">
            <p class="card-eyebrow"></p>
            <p class="card-text" id="cardFrontText"></p>
          </div>
          <div class="card-face card-back">
            <p class="card-front-recap" id="cardBackFrontText"></p>
            <p class="card-text card-text-back" id="cardBackText"></p>
          </div>
        </div>
      </div>
      <p class="tap-hint" id="tapHint"></p>
    </div>

    <div class="action-row" id="actionRow">
      <button class="flip-btn" id="flipBtn" type="button">
        <span class="flip-btn-label">Flip</span>
      </button>
      <div class="grade-row" id="gradeRow">
        <button class="grade-btn grade-miss" id="gradeMiss" type="button">
          <span class="grade-key">1</span> Missed
        </button>
        <button class="grade-btn grade-hard" id="gradeHard" type="button">
          <span class="grade-key">2</span> Hard
        </button>
        <button class="grade-btn grade-almost" id="gradeAlmost" type="button">
          <span class="grade-key">3</span> Almost
        </button>
        <button class="grade-btn grade-hit" id="gradeHit" type="button">
          <span class="grade-key">4</span> Got it!
        </button>
      </div>
    </div>
  </section>

  <!-- ================= RESULTS ================= -->
  <section class="screen" id="screen-results" aria-labelledby="results-heading">
    <header class="app-header">
      <p class="tagline">Session complete</p>
      <p class="score-big" id="scoreBig">0/0</p>
      <p class="score-sub" id="scoreSub">0% recalled</p>
      <button class="undo-link" id="undoFromResults" type="button" disabled>Undo last grade</button>
    </header>

    <div class="missed-wrap" id="missedWrap">
      <p class="missed-heading">To review</p>
      <ul class="missed-list" id="missedList"></ul>
    </div>

    <div class="result-actions">
      <button class="primary-btn" id="studyAgain" type="button">Study this deck again</button>
      <button class="ghost-btn" id="newDeck" type="button">Choose another deck</button>
    </div>
  </section>

  <!-- Lives outside every .screen on purpose: each .screen plays a CSS
       "rise" animation on entry, and animation-fill-mode:both leaves a
       lingering (identity) transform on it afterwards — which, per the
       CSS spec, would turn this position:fixed button into something
       anchored to that screen instead of the real viewport. -->
  <button class="scroll-top-btn scroll-top-btn-fixed" id="deckScrollTopBtn" type="button" aria-label="Back to top">&uarr;</button>

  <!-- ================= CONFIRM MODAL ================= -->
  <div class="modal-overlay" id="confirmOverlay" hidden>
    <div class="modal-box" role="alertdialog" aria-modal="true" aria-labelledby="confirmMessage">
      <p class="modal-message" id="confirmMessage"></p>
      <div class="modal-actions">
        <button class="ghost-btn modal-btn" id="confirmCancelBtn" type="button">Cancel</button>
        <button class="primary-btn modal-btn" id="confirmOkBtn" type="button">Yes, do it</button>
      </div>
    </div>
  </div>

</div>

<script src="app.js?v=9"></script>
</body>
</html>
