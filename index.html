<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b0e0d'/%3E%3Crect x='24' y='18' width='52' height='64' rx='8' fill='none' stroke='%234fd1a5' stroke-width='5'/%3E%3Cline x1='34' y1='38' x2='66' y2='38' stroke='%234fd1a5' stroke-width='5' stroke-linecap='round'/%3E%3Cline x1='34' y1='52' x2='58' y2='52' stroke='%234fd1a5' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b0e0d'/%3E%3Crect x='24' y='18' width='52' height='64' rx='8' fill='none' stroke='%234fd1a5' stroke-width='5'/%3E%3Cline x1='34' y1='38' x2='66' y2='38' stroke='%234fd1a5' stroke-width='5' stroke-linecap='round'/%3E%3Cline x1='34' y1='52' x2='58' y2='52' stroke='%234fd1a5' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<title>A N K I</title>
<link rel="stylesheet" href="style.css?v=30">
</head>
<body>

<div class="app">

  <!-- ================= DECK SELECT ================= -->
  <section class="screen active" id="screen-deck" aria-labelledby="deck-heading">
    <header class="app-header">
      <h1 class="wordmark">Anki</h1>
      <p class="tagline">Deck list.</p>
    </header>

    <div class="deck-list" id="deckList">
      <!-- deck buttons injected by app.js -->
    </div>

    <button class="deck-upload-btn" id="deckUploadBtn" type="button">
      <span class="deck-upload-icon" aria-hidden="true">+</span>
      <span>Upload your own deck (.csv)</span>
    </button>
    <input type="file" id="deckFileInput" accept=".csv,text/csv" hidden>
    <p class="deck-upload-error" id="deckUploadError" hidden></p>

    <div class="activity-heatmap" id="activityHeatmap">
      <p class="heatmap-heading">Flashcard activity</p>
      <div class="heatmap-nav">
        <button class="heatmap-nav-btn" id="heatmapPrevBtn" type="button" aria-label="Previous month">&lsaquo;</button>
        <p class="heatmap-month-label" id="heatmapMonthLabel"></p>
        <button class="heatmap-nav-btn" id="heatmapNextBtn" type="button" aria-label="Next month">&rsaquo;</button>
      </div>
      <div class="heatmap-swipe-area" id="heatmapSwipeArea">
        <div class="heatmap-weekdays">
          <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
        </div>
        <div class="heatmap-grid" id="heatmapGrid"></div>
      </div>
      <p class="heatmap-detail" id="heatmapDetail"></p>
    </div>
  </section>

  <!-- ================= COUNT SELECT ================= -->
  <section class="screen" id="screen-count" aria-labelledby="count-heading">
    <button class="back-link" id="backToDeck" type="button">&larr; Decks</button>
    <header class="app-header">
      <h1 class="deck-name" id="countDeckName">Deck</h1>
      <p class="tagline">How many?</p>
    </header>

    <div class="mode-toggle" id="modeToggle" role="group" aria-label="Study mode">
      <button class="mode-btn is-active" id="modeFlashcardBtn" type="button">Flashcards</button>
      <button class="mode-btn" id="modeMultichoiceBtn" type="button">Multiple choice</button>
    </div>

    <div class="count-grid" id="countGrid">
      <!-- count buttons injected by app.js -->
    </div>

    <div class="deck-preview" id="deckPreview">
      <div class="preview-head">
        <p class="preview-heading">Deck entries</p>
        <div class="preview-head-actions">
          <button class="unselect-btn" id="unselectAllBtn" type="button" disabled title="Turn every card back on">Unselect all</button>
          <button class="sort-toggle" id="sortToggle" type="button">Original</button>
        </div>
      </div>
      <button class="deck-upload-btn add-card-btn" id="addCardBtn" type="button" hidden>
        <span class="deck-upload-icon" aria-hidden="true">+</span>
        <span>Add a card</span>
      </button>
      <ul class="preview-list" id="previewList"></ul>
    </div>
  </section>

  <!-- ================= QUIZ ================= -->
  <section class="screen" id="screen-quiz" aria-labelledby="quiz-heading">
    <div class="quiz-top">
      <button class="back-link" id="quitQuiz" type="button">&larr; End session</button>
      <div class="quiz-top-right">
        <button class="undo-btn" id="undoBtn" type="button" disabled title="Go back to the last card and change its grade">
          <span aria-hidden="true">&#8617;</span> Undo
        </button>
        <span class="progress-count" id="progressCount">1 / 10</span>
      </div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <p class="score-live" id="scoreLive">
      <span class="score-hit" id="scoreHitCount">0</span> got it<span class="score-sep">&middot;</span><span class="score-miss" id="scoreMissCount">0</span> missed
    </p>

    <div class="card-stage" id="cardStage">
      <div class="card" id="card" tabindex="0" role="button" aria-pressed="false" aria-label="Flashcard, tap to reveal the answer">
        <div class="card-inner" id="cardInner">
          <div class="card-face card-front">
            <p class="card-eyebrow"></p>
            <p class="card-text" id="cardFrontText"></p>
          </div>
          <div class="card-face card-back">
            <p class="card-front-recap" id="cardBackFrontText"></p>
            <p class="card-text card-text-back" id="cardBackText"></p>
          </div>
        </div>
      </div>
      <p class="tap-hint" id="tapHint"></p>
    </div>

    <div class="mc-stage" id="mcStage" hidden>
      <p class="mc-prompt" id="mcPrompt"></p>
      <div class="mc-options" id="mcOptions"></div>
      <p class="mc-tap-hint" id="mcTapHint">Tap anywhere to continue</p>
    </div>

    <div class="action-row" id="actionRow">
      <button class="flip-btn" id="flipBtn" type="button">
        <span class="flip-btn-label">Flip</span>
      </button>
      <div class="grade-row" id="gradeRow">
        <button class="grade-btn grade-miss" id="gradeMiss" type="button">
          <span class="grade-key">1</span> Missed
        </button>
        <button class="grade-btn grade-hard" id="gradeHard" type="button">
          <span class="grade-key">2</span> Hard
        </button>
        <button class="grade-btn grade-almost" id="gradeAlmost" type="button">
          <span class="grade-key">3</span> Almost
        </button>
        <button class="grade-btn grade-hit" id="gradeHit" type="button">
          <span class="grade-key">4</span> Got it!
        </button>
      </div>
    </div>
  </section>

  <!-- ================= RESULTS ================= -->
  <section class="screen" id="screen-results" aria-labelledby="results-heading">
    <header class="app-header">
      <p class="tagline">Session complete</p>
      <p class="score-big" id="scoreBig">0/0</p>
      <p class="score-sub" id="scoreSub">0% recalled</p>
      <button class="undo-link" id="undoFromResults" type="button" disabled>Undo last grade</button>
    </header>

    <div class="missed-wrap" id="missedWrap">
      <p class="missed-heading">To review</p>
      <ul class="missed-list" id="missedList"></ul>
    </div>

    <div class="result-actions">
      <button class="primary-btn" id="backToDeckFromResults" type="button">Back to deck</button>
    </div>
  </section>

  <!-- Shared "back to top" arrow for both the deck list and the card
       preview list -- both scroll the whole page (not an inner
       container: .app only sets min-height, so it just grows taller
       than the viewport and the window itself scrolls), so one
       window-scroll-tracking button covers both. It lives outside
       every .screen on purpose: each .screen plays a CSS "rise"
       animation on entry, and animation-fill-mode:both leaves a
       lingering (identity) transform on it afterwards — which, per
       the CSS spec, would turn this position:fixed button into
       something anchored to that screen instead of the real viewport. -->
  <button class="scroll-top-btn" id="scrollTopBtn" type="button" aria-label="Back to top">&uarr;</button>

  <!-- ================= CONFIRM MODAL ================= -->
  <div class="modal-overlay" id="confirmOverlay" hidden>
    <div class="modal-box" role="alertdialog" aria-modal="true" aria-labelledby="confirmMessage">
      <p class="modal-message" id="confirmMessage"></p>
      <input type="text" class="modal-input" id="confirmInput" hidden>
      <div class="modal-card-fields" id="confirmCardFields" hidden>
        <label class="modal-field-label" for="confirmFront">Front</label>
        <input type="text" class="modal-input" id="confirmFront" placeholder="Front">
        <label class="modal-field-label" for="confirmBack">Back</label>
        <textarea class="modal-input modal-textarea" id="confirmBack" placeholder="Back" rows="3"></textarea>
      </div>
      <div class="modal-actions">
        <button class="ghost-btn modal-btn" id="confirmCancelBtn" type="button">Cancel</button>
        <button class="primary-btn modal-btn" id="confirmOkBtn" type="button">Yes, do it</button>
      </div>
    </div>
  </div>

</div>

<!-- Split into one file per feature area (see js/) instead of one
     big app.js — plain classic scripts (no bundler/module system),
     so they all still share one global scope like a single file
     would, and load order here is what defines it. Bump the shared
     ?v= below whenever any of these files change. -->
<script src="js/01-config.js?v=14"></script>
<script src="js/02-csv.js?v=14"></script>
<script src="js/03-storage.js?v=14"></script>
<script src="js/04-state.js?v=14"></script>
<script src="js/05-modal.js?v=14"></script>
<script src="js/06-deck-list.js?v=14"></script>
<script src="js/07-card-editor.js?v=14"></script>
<script src="js/08-count-screen.js?v=14"></script>
<script src="js/09-quiz-core.js?v=14"></script>
<script src="js/10-quiz-flashcard.js?v=14"></script>
<script src="js/11-quiz-multichoice.js?v=14"></script>
<script src="js/12-results.js?v=14"></script>
<script src="js/13-activity-heatmap.js?v=14"></script>
<script src="js/14-boot.js?v=14"></script>
</body>
</html>
